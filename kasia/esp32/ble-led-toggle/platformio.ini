; ble-led-toggle — minimal Kasia BLE example for ESP32
;
; Advertises a BLE GATT service the Kasia mobile/desktop app connects to.
; The app writes a single byte to the characteristic to toggle GPIOs:
;   bit7 = pin state, bits0-6 = GPIO number
; The onboard LED on esp32doit-devkit-v1 is GPIO 2.
;
; NOTE: pinned to the local work-in-progress library while the BLE rewrite
; is unpublished. Before releasing this example, switch `lib_deps` to
;   bromleysat/Kasia@^1.1.0
; (or whatever is on the registry at that time).

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../../../../bromleysat-kasia-wip
